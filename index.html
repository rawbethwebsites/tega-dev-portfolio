<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tega — Full-stack developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,300..900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ice:#E6EBF5; --ice-2:#D7DEEE; --ink:#1B1840; --ink-soft:#4A4770; --cocoa:#8A4B2A;
  --src:#15133D; --amber:#FFB547; --pink:#FF7AB6; --sky:#8FD3FF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
:root[data-theme="dark"]{ } /* hero is intentionally light on top; the source layer is the dark mode */
/* ---------- hacker mode (konami) ---------- */
html[data-theme="hacker"] body{background:var(--src);color:#D8D6F5}
html[data-theme="hacker"] .hero{background:linear-gradient(180deg,#15133D,#0E0D2B)}
html[data-theme="hacker"] .logo{color:#D8D6F5}
html[data-theme="hacker"] .links a{color:#A9A6E8}
html[data-theme="hacker"] .links a:hover{color:#fff}
html[data-theme="hacker"] .hello{border-color:rgba(216,214,245,.6);color:#D8D6F5!important}
html[data-theme="hacker"] .bio{color:#A9A6E8}
html[data-theme="hacker"] .btn.primary{background:#D8D6F5;color:var(--src)}
html[data-theme="hacker"] .btn.ghost{color:#D8D6F5;border-color:rgba(216,214,245,.4)}
html[data-theme="hacker"] .tag{background:#1B1848;color:#D8D6F5;box-shadow:0 14px 30px -12px rgba(0,0,0,.6)}
html[data-theme="hacker"] .hint,.dot{display:none}
.hacker-badge{position:fixed;left:clamp(16px,4vw,40px);bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:6;
  display:none;font:600 13px "JetBrains Mono",ui-monospace,monospace;color:var(--amber);
  background:rgba(21,19,61,.92);border:1px solid rgba(255,181,71,.35);padding:8px 14px;border-radius:10px;letter-spacing:.02em;
  box-shadow:0 10px 30px -12px rgba(0,0,0,.5)}
.hacker-badge.on{display:flex;align-items:center;gap:8px}
.hacker-badge .cur{display:inline-block;width:.6em;height:1.05em;background:var(--amber);animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--ice);color:var(--ink);font-family:"Anybody",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
.hero{position:relative;height:100%;min-height:560px;overflow:hidden;touch-action:none;
  background:radial-gradient(120% 90% at 78% 30%,#F1F4FA 0%,var(--ice) 45%,var(--ice-2) 100%)}
@media (hover:hover){.hero{cursor:none}}
.hero a,.hero button{cursor:none}
@media (hover:none){.hero a,.hero button{cursor:pointer}}

/* nav */
nav{position:absolute;inset:0 0 auto 0;display:flex;align-items:center;justify-content:space-between;
  padding:clamp(16px,3vw,32px) clamp(20px,5vw,64px);z-index:2}
.logo{font-weight:800;font-size:20px;font-variation-settings:"wdth" 75;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.links{display:flex;gap:clamp(16px,2.6vw,36px);align-items:center}
.links a{color:var(--ink-soft);text-decoration:none;font-size:15px;font-weight:500}
.links a:hover{color:var(--ink)}
.hello{padding:10px 18px;border-radius:999px;border:1.5px solid var(--ink);color:var(--ink)!important;font-weight:600!important}
@media (max-width:720px){.links a:not(.hello){display:none}}


/* layout */
.wrap{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);align-items:center;
  gap:clamp(24px,4vw,64px);padding:clamp(96px,12vh,140px) clamp(20px,5vw,64px) clamp(60px,10vh,110px);z-index:1}
.copy{max-width:640px}
h1{font-weight:800;font-size:clamp(46px,5.7vw,100px);line-height:.9;letter-spacing:-.025em;margin-bottom:28px}
h1 .line{display:block;overflow-y:clip;overflow-x:visible;padding-bottom:.06em;white-space:nowrap}
h1 .line>span{display:inline-block;font-variation-settings:"wdth" 100;animation:rise 1.1s cubic-bezier(.2,.8,.1,1) both}
h1 .line:nth-child(2) span{animation-delay:.12s}
h1 .line:nth-child(3)>span{animation-delay:.24s}
.word{display:inline-block;white-space:nowrap;position:relative;isolation:isolate;padding:0 .06em}
/* highlighter swipe behind the changing word */
.word::before{content:"";position:absolute;z-index:-1;left:-.04em;right:-.06em;top:.2em;bottom:.02em;
  background:linear-gradient(100deg,rgba(255,181,71,.85),#FFB547 12%,#FFC266 60%,rgba(255,181,71,.9));
  border-radius:.12em .3em .16em .34em;transform:skewX(-8deg) rotate(-1.2deg) scaleX(0);transform-origin:right center;
  transition:transform .38s cubic-bezier(.6,0,.8,.4)}
.word.hl-on::before{transform:skewX(-8deg) rotate(-1.2deg) scaleX(1);transform-origin:left center;
  transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.word .ch{display:inline-block;will-change:transform}
.ch.out{animation:chOut .5s cubic-bezier(.6,0,.8,.4) both}
.ch.in{animation:chIn .75s cubic-bezier(.2,.9,.2,1.15) both}
@keyframes chOut{to{transform:translateY(-110%) rotate(-8deg);opacity:0;filter:blur(4px);font-variation-settings:"wdth" 150}}
@keyframes chIn{from{transform:translateY(110%) rotate(6deg);opacity:0;font-variation-settings:"wdth" 50}to{transform:none;opacity:1;font-variation-settings:"wdth" 100}}
@keyframes rise{from{transform:translateY(105%);font-variation-settings:"wdth" 50}to{transform:none;font-variation-settings:"wdth" 100}}
.bio{font-size:clamp(16px,1.35vw,19px);line-height:1.55;color:var(--ink-soft);max-width:34em;margin-bottom:32px;
  font-variation-settings:"wdth" 92;animation:fade .9s .5s both}
.ctas{display:flex;gap:12px;flex-wrap:wrap;animation:fade .9s .65s both}
.btn{font:inherit;font-weight:650;font-size:16px;padding:16px 26px;border-radius:14px;text-decoration:none;display:inline-block;
  transition:transform .35s cubic-bezier(.2,.8,.1,1),background .25s}
.btn.primary{background:var(--ink);color:var(--ice)}
.btn.primary:hover{background:var(--cocoa)}
.btn.ghost{color:var(--ink);border:1.5px solid rgba(27,24,64,.25)}
.btn:focus-visible,.links a:focus-visible,.logo:focus-visible{outline:3px solid var(--cocoa);outline-offset:3px}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.portrait{justify-self:end;width:min(100%,440px);aspect-ratio:4/5.3;position:relative;animation:arch 1.3s .1s cubic-bezier(.2,.8,.1,1) both}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;border-radius:999px 999px 28px 28px;display:block;
  box-shadow:0 40px 80px -30px rgba(27,24,64,.35)}
@keyframes arch{from{clip-path:inset(100% 0 0 0 round 999px 999px 28px 28px);transform:translateY(40px)}to{clip-path:inset(-40% -40% -40% -40% round 0);transform:none}}
.tag{position:absolute;left:-18px;bottom:14%;background:#fff;color:var(--ink);padding:10px 14px 10px 12px;border-radius:14px;font-size:14px;font-weight:600;
  display:flex;gap:8px;align-items:center;box-shadow:0 14px 30px -12px rgba(27,24,64,.3);animation:fade .8s .9s both}
.tag i{width:9px;height:9px;border-radius:50%;background:#2FB36B;box-shadow:0 0 0 4px rgba(47,179,107,.18)}

.hint{position:absolute;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:4;
  font-size:14px;font-weight:600;color:var(--ink);background:rgba(255,255,255,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:10px 16px;border-radius:999px;white-space:nowrap;transition:opacity .5s;animation:fade .8s 1.4s both}
.hint.gone{opacity:0}

canvas#reveal{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.dot{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--amber);z-index:5;pointer-events:none;
  box-shadow:0 0 0 2px var(--src);opacity:0;transition:opacity .3s}
@media (hover:hover){.dot.on{opacity:1}}

@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;align-content:start;align-items:start;padding-top:calc(78px + env(safe-area-inset-top,0px));gap:22px}
  .portrait{order:-1;justify-self:end;width:min(64vw,330px);max-height:42svh;aspect-ratio:4/5}
  .tag{left:-44px;bottom:10%;font-size:13px}
  h1{font-size:clamp(34px,10.2vw,72px);margin-bottom:16px}
  .bio{margin-bottom:22px;font-size:15.5px}
  .btn{padding:14px 20px;font-size:15px}
}
@media (max-height:640px) and (max-width:820px){.portrait{max-height:34svh}.bio{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(() => {
const hero = document.getElementById('hero');
const cv = document.getElementById('reveal');
const ctx = cv.getContext('2d');
const photo = document.getElementById('photo');
const dotEl = document.getElementById('dot');
const hint = document.getElementById('hint');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const touchy = matchMedia('(hover: none)').matches;
if (touchy) hint.textContent = 'Drag anywhere to see the code';

const C = {src:'#15133D', text:'#D8D6F5', amber:'#FFB547', pink:'#FF7AB6', sky:'#8FD3FF', dim:'#6E6AAE', punct:'#A9A6E8'};
let W=0,H=0,DPR=1;
const dark = document.createElement('canvas'), dctx = dark.getContext('2d');   // static source layer
const comp = document.createElement('canvas'), cctx = comp.getContext('2d');   // source layer + live ascii
const mask = document.createElement('canvas'), mctx = mask.getContext('2d');   // inner blob
let ascii = null;   // {x,y,cols,rows,fs,cw,ch,dens[],clip}
let ready = false;

/* ---------- syntax colouring ---------- */
function tokens(line){
  const out=[]; const re=/(\/\/.*$)|("[^"]*")|(<\/?[A-Za-z0-9]+|\/?>)|\b(import|from|const|return|true|false)\b|([A-Za-z_]+)(?=\s*:)|([A-Za-z_]+)(?==)|([{}\[\](),;:=.])/g;
  let last=0,m;
  while((m=re.exec(line))){
    if(m.index>last) out.push([line.slice(last,m.index),C.text]);
    const col = m[1]?C.dim : m[2]?C.pink : m[3]?C.amber : m[4]?C.amber : m[5]?C.sky : m[6]?C.sky : C.punct;
    out.push([m[0],col]); last=m.index+m[0].length;
  }
  if(last<line.length) out.push([line.slice(last),C.text]);
  return out;
}
function drawCode(g, lines, x, y, fs, lh){
  g.font = `400 ${fs}px "JetBrains Mono", ui-monospace, Menlo, monospace`;
  g.textBaseline='top';
  lines.forEach((ln,i)=>{
    let cx=x;
    for(const [t,col] of tokens(ln)){ g.fillStyle=col; g.fillText(t,cx,y+i*lh); cx+=g.measureText(t).width; }
  });
}

/* ---------- build the "source" dark mode ---------- */
function rel(el){ const r=el.getBoundingClientRect(), h=hero.getBoundingClientRect(); return {x:r.left-h.left,y:r.top-h.top,w:r.width,h:r.height}; }

function buildDark(){
  dark.width=comp.width=mask.width=cv.width=Math.round(W*DPR);
  dark.height=comp.height=mask.height=cv.height=Math.round(H*DPR);
  const g=dctx; g.setTransform(DPR,0,0,DPR,0,0);
  g.fillStyle=C.src; g.fillRect(0,0,W,H);
  // dotted grid
  g.fillStyle='rgba(169,166,232,.13)';
  for(let x=12;x<W;x+=24) for(let y=12;y<H;y+=24) g.fillRect(x,y,1.2,1.2);
  // line numbers
  g.font='400 11px "JetBrains Mono", monospace'; g.fillStyle='rgba(169,166,232,.28)'; g.textBaseline='top';
  for(let i=1,y=10;y<H;i++,y+=22) g.fillText(String(i).padStart(3,' '),6,y);


  // every element with data-code gets its source drawn in its own box
  document.querySelectorAll('[data-code]').forEach(el=>{
    const r=rel(el); const lines=el.dataset.code.split('|');
    const longest=Math.max(...lines.map(l=>l.length));
    let fs=Math.min(r.w/(longest*0.6), el.tagName==='H1'?30:17);
    fs=Math.max(fs, el.tagName==='H1'?13:9.5);
    const lh=fs*1.45;
    const blockH=lines.length*lh;
    const y=r.y+Math.max(0,(r.h-blockH)/2);
    drawCode(g,lines,r.x,y,fs,lh);
  });

  // ascii portrait geometry
  const pr=rel(photo);
  const fs=Math.max(6.5,Math.min(11,pr.w/46)); const cw=fs*0.6, ch=fs*1.02;
  const cols=Math.floor(pr.w/cw), rows=Math.floor(pr.h/ch);
  const s=document.createElement('canvas'); s.width=cols; s.height=rows; const sg=s.getContext('2d',{willReadFrequently:true});
  // object-fit: cover, object-position: 50% 22%
  const iw=photo.naturalWidth, ih=photo.naturalHeight, tr=pr.w/pr.h, ir=iw/ih;
  let sw,sh,sx,sy; if(ir>tr){sh=ih;sw=ih*tr;sx=(iw-sw)*.5;sy=0}else{sw=iw;sh=iw/tr;sx=0;sy=(ih-sh)*.22}
  sg.drawImage(photo,sx,sy,sw,sh,0,0,cols,rows);
  const px=sg.getImageData(0,0,cols,rows).data; const lum=new Float32Array(cols*rows);
  for(let i=0;i<cols*rows;i++) lum[i]=(px[i*4]*.299+px[i*4+1]*.587+px[i*4+2]*.114)/255;
  const sorted=Array.from(lum).sort((a,b)=>a-b); const lo=sorted[Math.floor(sorted.length*.03)], hi=sorted[Math.floor(sorted.length*.97)];
  const dens=new Float32Array(cols*rows);
  // light pixels become glyphs: face and highlights read as bright code on the dark field
  for(let i=0;i<lum.length;i++){ let d=(lum[i]-lo)/(hi-lo+1e-6); d=Math.min(1,Math.max(0,d)); dens[i]=Math.pow(d,1.35); }
  ascii={x:pr.x,y:pr.y,w:pr.w,h:pr.h,cols,rows,fs,cw,ch,dens};
  ready=true; paintAscii(0);
  if(!touched){ head.x=pr.x+pr.w*.5; head.y=pr.y+pr.h*.32; trail.forEach(n=>{n.x=head.x;n.y=head.y;}); }
}

const RAMP=' .·:-=+*oxX#%@';
function paintAscii(t){
  const g=cctx; g.setTransform(1,0,0,1,0,0); g.drawImage(dark,0,0); if(!ascii) return;
  g.setTransform(DPR,0,0,DPR,0,0);
  const a=ascii; g.save();
  // arch clip, same shape as the photo
  const r=a.w/2; g.beginPath(); g.moveTo(a.x,a.y+r); g.arc(a.x+r,a.y+r,r,Math.PI,0); g.lineTo(a.x+a.w,a.y+a.h-24);
  g.quadraticCurveTo(a.x+a.w,a.y+a.h,a.x+a.w-24,a.y+a.h); g.lineTo(a.x+24,a.y+a.h); g.quadraticCurveTo(a.x,a.y+a.h,a.x,a.y+a.h-24); g.closePath();
  g.fillStyle='#1B1848'; g.fill(); g.clip();
  g.font=`600 ${a.fs}px "JetBrains Mono", monospace`; g.textBaseline='top';
  const scan=((t*0.00018)%1.3-.15)*a.rows;
  for(let y=0;y<a.rows;y++){
    const boost=Math.max(0,1-Math.abs(y-scan)/3)*.35;
    for(let x=0;x<a.cols;x++){
      let d=a.dens[y*a.cols+x]; if(d<.08) continue;
      d=Math.min(1,d+boost+(Math.random()<.03?(Math.random()-.5)*.35:0));
      const ch=RAMP[Math.min(RAMP.length-1,Math.floor(d*RAMP.length))];
      // amber in the mids, pink in the densest shadows
      g.fillStyle = d>.82?'#FFE3B0' : d>.4?C.amber : C.pink;
      g.globalAlpha=.25+d*.75;
      g.fillText(ch,a.x+x*a.cw,a.y+y*a.ch);
    }
  }
  g.restore(); g.globalAlpha=1;
}

/* ---------- liquid blob ---------- */
let base=90;                         // desired resting radius
const head={x:0,y:0,vx:0,vy:0};
const trail=Array.from({length:8},()=>({x:0,y:0}));
const drops=[];
let target={x:0,y:0}, pointer={x:0,y:0,in:false}, touched=false, pulse=1;
const SCALE=[.95,.87,.79,.71,.63,.55,.47,.39];

function size(){
  const r=hero.getBoundingClientRect(); W=r.width; H=r.height; DPR=Math.min(touchy?1.5:2,window.devicePixelRatio||1);
  base=Math.max(64,Math.min(130,Math.min(W,H)*(touchy?.2:.145)));
}

function particles(t){
  const R=base/2.05*pulse; const P=[];
  P.push({x:head.x,y:head.y,r:R});
  trail.forEach((n,i)=>P.push({x:n.x,y:n.y,r:R*SCALE[i]}));
  // three orbiting lobes keep the edge wobbling even when still
  for(let k=0;k<3;k++){const a=t*.0007*(k%2?1:-1.3)+k*2.1; const o=R*.28; P.push({x:head.x+Math.cos(a)*o,y:head.y+Math.sin(a*1.3)*o*.8,r:R*.55});}
  drops.forEach(d=>P.push(d));
  return P;
}

const CELL=touchy?10:8;
let FG=null;
function field(P){
  // bounding box around all particles
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  const core=base*pulse*1.3; for(const p of P){const e=(p.r>base*.3?Math.max(core,p.r*1.6):p.r*1.7)+CELL; x0=Math.min(x0,p.x-e);y0=Math.min(y0,p.y-e);x1=Math.max(x1,p.x+e);y1=Math.max(y1,p.y+e);}
  x0=Math.floor(Math.max(-CELL,x0)/CELL)*CELL; y0=Math.floor(Math.max(-CELL,y0)/CELL)*CELL;
  x1=Math.min(W+CELL,x1); y1=Math.min(H+CELL,y1);
  const cols=Math.ceil((x1-x0)/CELL)+1, rows=Math.ceil((y1-y0)/CELL)+1;
  if(cols<2||rows<2){FG=null;return;}
  const f=new Float32Array(cols*rows);
  for(let j=0;j<rows;j++){const y=y0+j*CELL; for(let i=0;i<cols;i++){const x=x0+i*CELL; let s=0;
    for(const p of P){const dx=x-p.x,dy=y-p.y; s+=p.r*p.r/(dx*dx+dy*dy+1);} f[j*cols+i]=s;}}
  FG={f,x0,y0,cols,rows};
}
function contour(thr, g){
  g.beginPath(); if(!FG) return;
  const {f,x0,y0,cols,rows}=FG;
  const pts=[];
  for(let j=0;j<rows-1;j++) for(let i=0;i<cols-1;i++){
    const x=x0+i*CELL,y=y0+j*CELL;
    const v=[f[j*cols+i],f[j*cols+i+1],f[(j+1)*cols+i+1],f[(j+1)*cols+i]];
    if(v[0]<thr&&v[1]<thr&&v[2]<thr&&v[3]<thr) continue;
    const c=[[x,y],[x+CELL,y],[x+CELL,y+CELL],[x,y+CELL]];
    pts.length=0;
    for(let k=0;k<4;k++){const n=(k+1)%4; const a=v[k]>=thr,b=v[n]>=thr;
      if(a) pts.push(c[k]);
      if(a!==b){const tt=(thr-v[k])/(v[n]-v[k]); pts.push([c[k][0]+(c[n][0]-c[k][0])*tt,c[k][1]+(c[n][1]-c[k][1])*tt]);}}
    if(pts.length<3) continue;
    g.moveTo(pts[0][0],pts[0][1]); for(let k=1;k<pts.length;k++) g.lineTo(pts[k][0],pts[k][1]); g.closePath();
  }
}

function splash(x,y,n,spd){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2, s=spd*(.5+Math.random());
    drops.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:base/2.05*(.22+Math.random()*.22)});}
}

let lastAscii=0;
function frame(t){
  requestAnimationFrame(frame);
  if(!ready) return;
  if(touched){ target.x=pointer.x; target.y=pointer.y; }
  else { const pr=ascii; target.x=pr?pr.x+pr.w*.5:W*.7; target.y=pr?pr.y+pr.h*.32:H*.4; }

  if(reduce){ head.x=target.x; head.y=target.y; head.vx=head.vy=0; }
  else { const nx=head.x+(target.x-head.x)*.5, ny=head.y+(target.y-head.y)*.5; head.vx=nx-head.x; head.vy=ny-head.y; head.x=nx; head.y=ny; }
  let prev=head; for(const n of trail){ n.x+=(prev.x-n.x)*(reduce?1:.55); n.y+=(prev.y-n.y)*(reduce?1:.55); prev=n; }

  const speed=Math.hypot(head.vx,head.vy);
  if(!reduce && speed>14 && Math.random()<.35 && drops.length<22){
    const px=-head.vy/speed, py=head.vx/speed, side=Math.random()<.5?-1:1;
    drops.push({x:head.x,y:head.y,vx:head.vx*.55+px*side*(2+Math.random()*4),vy:head.vy*.55+py*side*(2+Math.random()*4),r:base/2.05*(.18+Math.random()*.2)});
  }
  for(let i=drops.length-1;i>=0;i--){const d=drops[i];
    const dx=head.x-d.x, dy=head.y-d.y, dist=Math.hypot(dx,dy)+1e-3;
    if(dist<base*2.4){d.vx+=dx/dist*.35; d.vy+=dy/dist*.35;}   // surface tension pulls them home
    d.vx*=.93; d.vy*=.93; d.x+=d.vx; d.y+=d.vy; d.r*=.97;
    if(d.r<3.5) drops.splice(i,1);}
  pulse+=(1-pulse)*.08;

  const nearPhoto=ascii && head.x>ascii.x-base*1.6 && head.x<ascii.x+ascii.w+base*1.6 && head.y>ascii.y-base*1.6 && head.y<ascii.y+ascii.h+base*1.6;
  if(nearPhoto && t-lastAscii>140){ paintAscii(t); lastAscii=t; }

  const P=particles(t); field(P);
  // inner: source layer through the blob
  mctx.setTransform(1,0,0,1,0,0); mctx.globalCompositeOperation='source-over'; mctx.clearRect(0,0,mask.width,mask.height);
  mctx.setTransform(DPR,0,0,DPR,0,0); mctx.fillStyle='#000'; contour(1,mctx); mctx.fill();
  mctx.globalCompositeOperation='source-in'; mctx.setTransform(1,0,0,1,0,0); mctx.drawImage(comp,0,0);
  mctx.globalCompositeOperation='source-over';

  // outer: amber meniscus, then the inner on top
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=C.amber; contour(.9,ctx); ctx.fill();
  ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(mask,0,0);
  // glossy highlight so it reads as liquid
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const R=base*pulse; const hx=head.x-R*.38-head.vx*.6, hy=head.y-R*.42-head.vy*.6;
  const grd=ctx.createRadialGradient(hx,hy,0,hx,hy,R*.35); grd.addColorStop(0,'rgba(255,255,255,.22)'); grd.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=grd; ctx.beginPath(); ctx.ellipse(hx,hy,R*.35,R*.22,-.6,0,Math.PI*2); ctx.fill();

  dotEl.style.transform=`translate(${pointer.x}px,${pointer.y}px)`;
}

/* ---------- input ---------- */
function toLocal(e){const r=hero.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top};}
hero.addEventListener('pointermove',e=>{const p=toLocal(e); pointer.x=p.x; pointer.y=p.y; pointer.in=true; touched=true; dotEl.classList.add('on'); hint.classList.add('gone');});
hero.addEventListener('pointerdown',e=>{const p=toLocal(e); pointer.x=p.x; pointer.y=p.y; pointer.in=true; touched=true;
  if(e.pointerType!=='mouse'){head.x=p.x; head.y=p.y; trail.forEach(n=>{n.x=p.x;n.y=p.y;});}
  if(!reduce){ pulse=1.28; splash(p.x,p.y,9,9); } hint.classList.add('gone');});
hero.addEventListener('pointerleave',()=>{pointer.in=false; dotEl.classList.remove('on');});

let rt; addEventListener('resize',()=>{clearTimeout(rt); rt=setTimeout(()=>{size(); buildDark();},150);});

/* ---------- konami easter egg ---------- */
const KONAMI=['arrowup','arrowup','arrowdown','arrowdown','arrowleft','arrowright','arrowleft','arrowright','b','a'];
const konami=(()=>{const q=[];const N=KONAMI.length;return key=>{q.push(key);if(q.length>N)q.shift();return q.length===N&&q.every((k,i)=>k===KONAMI[i]);};})();
const HACK_KEY='tega:hacker-mode';

function setHacker(on){
  document.documentElement.dataset.theme=on?'hacker':'';
  document.getElementById('hackerBadge').classList.toggle('on',on);
  document.getElementById('hint').classList.add('gone');
  try{localStorage.setItem(HACK_KEY,on?'1':'0');}catch(e){}
}

function beep(kind){
  if(reduce) return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const dur=.22, n=kind==='off'?1:2, oscs=[];
    for(let i=0;i<n;i++){
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='square'; o.frequency.value=kind==='off'?(i?392:196):(i?988:659);
      g.gain.setValueAtTime(.06,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime+i*.13); o.stop(ctx.currentTime+dur+i*.13); oscs.push(o,g);
    }
    oscs.forEach(x=>{try{x.onended=()=>{if(ctx.state==='running')ctx.close();};}catch(e){}});
  }catch(e){}
}

addEventListener('keydown',e=>{
  if(e.key.toLowerCase()==='escape'&&document.documentElement.dataset.theme==='hacker'){setHacker(false);beep('off');return;}
  if(e.metaKey||e.ctrlKey||e.altKey||e.repeat) return;
  if(konami(e.key.toLowerCase())){
    const on=document.documentElement.dataset.theme!=='hacker';
    setHacker(on);
    if(on)console.log('%c⬆⬆⬇⬇⬅➡⬅➡🅱🅰  hacker mode engaged. you found the tega backdoor. ⬆⬆⬇⬇⬅➡⬅➡🅱🅰','color:#FFB547;font-weight:bold;background:#15133D;padding:6px 10px;border-radius:6px');
    beep(on?'on':'off');
  }
});

// restore saved preference, hidden until (re)discovered
try{if(localStorage.getItem(HACK_KEY)==='1')setHacker(true);}catch(e){}

async function init(){
  size(); head.x=W*.5; head.y=H*.5; trail.forEach(n=>{n.x=head.x;n.y=head.y;});
  try{ await Promise.race([Promise.all([document.fonts.load('400 14px "JetBrains Mono"'),document.fonts.load('800 40px "Anybody"'),document.fonts.ready]), new Promise(r=>setTimeout(r,2500))]); }catch(e){}
  if(!photo.complete) await new Promise(r=>{photo.onload=r; photo.onerror=r;});
  // wait for the entrance to settle so the code lines up with the final layout
  setTimeout(()=>{size(); buildDark();}, reduce?0:1500);
  requestAnimationFrame(frame);
}
/* ---------- rotating last word ---------- */
const WORDS=['alive','good','fast'];
const wordEl=document.getElementById('word'), h1=document.getElementById('headline');
let wi=0;
function setCode(w){ h1.dataset.code=`<h1 className="hero">|  I build software|  that feels {"${w}"}.|</h1>`; }
function swapWord(){
  const next=WORDS[(wi=(wi+1)%WORDS.length)];
  if(reduce){ wordEl.textContent=next; setCode(next); if(ready) buildDark(); return; }
  const old=[...wordEl.textContent];
  wordEl.classList.remove('hl-on');
  setTimeout(()=>{
  wordEl.innerHTML=old.map((c,i)=>`<span class="ch out" style="animation-delay:${i*35}ms">${c}</span>`).join('');
  setTimeout(()=>{
    wordEl.innerHTML=[...next].map((c,i)=>`<span class="ch in" style="animation-delay:${i*45}ms">${c}</span>`).join('');
    setCode(next);
    setTimeout(()=>wordEl.classList.add('hl-on'), 280+next.length*45);
    setTimeout(()=>{ if(ready) buildDark(); }, 250);
  }, 360+old.length*35);
  }, 380);
}
setTimeout(()=>wordEl.classList.add('hl-on'), reduce?0:1300);
setTimeout(()=>setInterval(swapWord,2600),1800);

init();
})();
